<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Площадка · ДГТУ</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="brand">
          <img src="/assets/dgtu-logo.png" alt="ДГТУ" />Площадка
        </div>
        <nav id="nav" hidden>
          <button id="edit" type="button">Мой профиль</button
          ><button id="logout" type="button">Выйти</button>
        </nav>
      </div>
    </header>
    <main>
      <p id="error" role="alert" hidden></p>
      <section id="auth" class="split">
        <div class="welcome">
          <small>ДГТУ · Ростов-на-Дону</small>
          <h1>Возможности<br />для студентов</h1>
          <p>Стажировки, хакатоны и обучение по твоим интересам.</p>
        </div>
        <form id="authForm">
          <h2 id="authTitle">Вход</h2>
          <label id="nameLabel" hidden
            >Имя<input
              name="full_name"
              autocomplete="name"
              maxlength="120" /></label
          ><label
            >Электронная почта<input
              name="email"
              type="email"
              required
              autocomplete="email" /></label
          ><label
            >Пароль<input
              name="password"
              type="password"
              required
              autocomplete="current-password" /></label
          ><button class="primary" id="submitAuth">Войти</button
          ><button class="link" type="button" id="toggleAuth">
            Создать аккаунт
          </button>
        </form>
      </section>
      <section id="profile" class="panel" hidden>
        <h1>Мой профиль</h1>
        <form id="profileForm">
          <label>Факультет ДГТУ<select name="faculty" required></select></label
          ><label>Направление<select name="program" required></select></label
          ><label
            >Курс<select name="course">
              <option value="">Не указан</option>
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
              <option>5</option>
              <option>6</option>
            </select></label
          >
          <fieldset>
            <legend>Что тебе интересно?</legend>
            <div id="topics"></div>
          </fieldset>
          <fieldset>
            <legend>Предпочитаемые типы предложений</legend>
            <div id="types"></div>
          </fieldset>
          <button class="primary">Сохранить и открыть ленту</button>
        </form>
      </section>
      <section id="feed" hidden>
        <h1>Возможности</h1>
        <div class="tabs">
          <button id="personalized" aria-pressed="true">Для меня</button
          ><button id="all" aria-pressed="false">Все возможности</button>
        </div>
        <p id="count" aria-live="polite"></p>
        <div id="cards"></div>
        <button id="more" hidden>Показать ещё</button>
      </section>
    </main>
  </body>
</html>
