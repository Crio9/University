services:
  db:
    image: postgres:16-alpine
    container_name: uni-personal-db
    environment:
      POSTGRES_USER: uni
      POSTGRES_PASSWORD: uni
      POSTGRES_DB: uni_personal
    ports:
      - "5432:5432"
    volumes:
      - uni_personal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uni -d uni_personal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uni_personal_pgdata:
