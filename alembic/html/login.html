<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | MyUni</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            color: #263247;
        }

        .login-container {
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 15px 50px rgba(40, 70, 110, 0.08);
        }

        .welcome-section {
            background: linear-gradient(145deg, #2878e8, #65a4f5);
            color: white;
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

    .logo {
    display: flex;
    align-items: center;
    gap: 13px;
    font-size: 30px;
    font-weight: bold;
    }

    .logo img {
        width: 55px;
        height: 55px;
        object-fit: contain;
        background: white;
        border-radius: 50%;
        padding: 4px;
    }

        .welcome-content {
            position: relative;
            z-index: 1;
        }

        .welcome-content h1 {
            font-size: 36px;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .welcome-content p {
            font-size: 15px;
            line-height: 1.7;
            color: #eaf3ff;
            max-width: 350px;
        }

        .welcome-footer {
            font-size: 13px;
            color: #eaf3ff;
        }

        .decoration {
            position: absolute;
            width: 280px;
            height: 280px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            right: -100px;
            bottom: -80px;
        }

        .decoration::before {
            content: "";
            position: absolute;
            width: 190px;
            height: 190px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: 35px;
            left: 35px;
        }

        .form-section {
            padding: 65px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-section h2 {
            font-size: 29px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #929bad;
            font-size: 14px;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 9px;
            color: #536078;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e1e7f0;
            border-radius: 11px;
            outline: none;
            font-size: 14px;
            background: #fbfcfe;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #4389ec;
            background: white;
            box-shadow: 0 0 0 3px rgba(40, 120, 232, 0.08);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .show-password {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #2878e8;
            font-size: 12px;
            cursor: pointer;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0 25px;
            font-size: 13px;
            color: #758197;
        }

        .remember-row input {
            accent-color: #2878e8;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            background: #2878e8;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #1766d2;
            transform: translateY(-1px);
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #d34e4e;
        }

        .message.success {
            display: block;
            background: #edf9f1;
            color: #218653;
        }

        .register-link {
            text-align: center;
            margin-top: 27px;
            font-size: 13px;
            color: #8993a5;
        }

        .register-link a {
            color: #2878e8;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 750px) {
            .login-container {
                grid-template-columns: 1fr;
                max-width: 480px;
            }

            .welcome-section {
                min-height: 240px;
                padding: 30px;
            }

            .welcome-content h1 {
                font-size: 27px;
            }

            .welcome-footer {
                margin-top: 25px;
            }

            .form-section {
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Приветственная часть -->
        <section class="welcome-section">

            <div class="logo">
            <img src="dgtu-logo.png" alt="Логотип ДГТУ">
            <span>ДГТУ MyUni.</span>
            </div>

            <div class="welcome-content">
                <h1>Рады видеть тебя снова!</h1>

                <p>
                    MyUni — единое цифровое пространство
                    для студентов, где университетская жизнь
                    становится ближе и удобнее.
                </p>
            </div>

            <div class="welcome-footer">
                Твой университет. Твои возможности.
            </div>

            <div class="decoration"></div>

        </section>

        <!-- Форма входа -->
        <section class="form-section">

            <h2>Вход в аккаунт</h2>

            <p class="subtitle">
                Введи свои данные, чтобы продолжить работу с MyUni.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Электронная почта</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@mail.ru"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="Введите пароль"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >
                            Показать
                        </button>
                    </div>
                </div>

                <label class="remember-row">
                    <input type="checkbox" id="rememberMe">
                    Запомнить меня на этом устройстве
                </label>

                <button type="submit" class="login-button">
                    Войти
                </button>

                <div class="message" id="loginMessage"></div>

            </form>

            <div class="register-link">
                Ещё нет аккаунта?
                <a href="register.html">Зарегистрироваться</a>
            </div>

        </section>

    </div>

    <script>

        // Показываем или скрываем пароль
        document.getElementById("showPassword").addEventListener("click", function() {

            const passwordInput = document.getElementById("password");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                this.textContent = "Скрыть";
            } else {
                passwordInput.type = "password";
                this.textContent = "Показать";
            }

        });

        // Обрабатываем форму входа
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const message = document.getElementById("loginMessage");

            message.className = "message";

            if (email === "" || password === "") {
                message.textContent = "Заполни все поля.";
                message.classList.add("error");
                return;
            }

            // Проверяем, сохранён ли профиль на этом устройстве
            const savedProfile = JSON.parse(
                localStorage.getItem("myUniProfile")
            );

            if (savedProfile && savedProfile.email !== email) {
                message.textContent = "На этом устройстве сохранён другой профиль.";
                message.classList.add("error");
                return;
            }

            // Демонстрационный вход без проверки пароля через сервер
            message.textContent = "Вход выполнен! Перенаправляем на главную страницу.";
            message.classList.add("success");

            setTimeout(function() {
                window.location.href = "home.html";
            }, 1000);

        });

    </script>

</body>
</html>
