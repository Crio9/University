name: Backend tests

on:
  push:
    branches:
      - feature/telegram-ingestion-develop
      - feature/nvidia-ai-classifier
      - codex/llm-ingestion-integration
      - develop
      - sprint3
      - sprint3-merge
      - release-backend
  pull_request:
    branches:
      - develop
      - sprint3
      - sprint3-merge
      - release-backend

permissions:
  contents: read

jobs:
  pytest:
    name: PostgreSQL migrations and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uni
          POSTGRES_PASSWORD: uni
          POSTGRES_DB: uni_service_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uni -d uni_service_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DEBUG: 'false'
      JWT_SECRET: github-ci-example-key-for-tests-not-production-123456
      DATABASE_URL: postgresql+asyncpg://uni:uni@localhost:5432/uni_service_ci
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://uni:uni@localhost:5432/uni_service_ci
      TEST_DATABASE_URL: postgresql+asyncpg://uni:uni@localhost:5432/uni_service_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create a separate disposable integration test database
        run: |
          PGPASSWORD=uni psql -h 127.0.0.1 -U uni -d postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE uni_service_ci_test'
      - name: Python compile check
        run: python -m compileall -q app tests alembic/versions
      - name: Verify single Alembic head and run migrations
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config('alembic.ini')).get_heads()
          assert len(heads) == 1, f'Expected one Alembic head, got: {heads}'
          print('Alembic single head:', heads[0])
          PY
          alembic upgrade head
          python seed.py
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from app.db.database import engine

          async def verify():
              async with engine.connect() as conn:
                  for table in ('users', 'posts', 'raw_contents', 'universities',
                                'study_groups', 'schedule_entries', 'staff_schedule_groups'):
                      count = (await conn.execute(text(f'SELECT count(*) FROM {table}'))).scalar_one()
                      print(f'{table}: {count} rows')
                  version = (await conn.execute(text('SELECT version_num FROM alembic_version'))).scalar_one()
                  from alembic.config import Config
                  from alembic.script import ScriptDirectory
                  head = ScriptDirectory.from_config(Config('alembic.ini')).get_current_head()
                  assert version == head, f'Database at {version}, expected {head}'
              await engine.dispose()

          asyncio.run(verify())
          PY
      - name: Run all tests including real Alembic upgrade paths
        run: python -m pytest -q -ra

  docker-compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DEBUG: 'false'
      POSTGRES_USER: uni
      POSTGRES_PASSWORD: ci_docker_password_123456
      POSTGRES_DB: uni_service_docker_ci
      JWT_SECRET: github-docker-ci-example-key-not-production-123456
      BACKEND_PORT: '18000'
      NVIDIA_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose -p myuni-sprint3-ci config --quiet
      - name: Build and start backend and PostgreSQL
        run: docker compose -p myuni-sprint3-ci up -d --build
      - name: Apply migrations and seed inside backend container
        run: |
          docker compose -p myuni-sprint3-ci exec -T backend alembic upgrade head
          docker compose -p myuni-sprint3-ci exec -T backend python seed.py
          docker compose -p myuni-sprint3-ci exec -T backend alembic current
      - name: Verify HTTP health and OpenAPI
        run: |
          curl --fail --silent --show-error --retry 30 --retry-connrefused \
            --retry-delay 2 http://127.0.0.1:18000/health
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 2 http://127.0.0.1:18000/openapi.json -o /tmp/myuni-openapi.json
          python - <<'PY'
          import json
          with open('/tmp/myuni-openapi.json', encoding='utf-8') as f:
              doc = json.load(f)
          paths = doc['paths']
          for endpoint in (
              '/api/v1/universities', '/api/v1/posts/feed',
              '/api/v1/schedule/me', '/api/v1/schedule/group',
              '/api/v1/appeals/me', '/api/v1/appeals/{appeal_id}/status',
              '/api/v1/ingest/sync',
          ):
              assert endpoint in paths, endpoint
          print('Expected OpenAPI endpoints found')
          PY
      - name: Logs if Docker smoke test fails
        if: failure()
        run: docker compose -p myuni-sprint3-ci logs --no-color --tail=150
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose -p myuni-sprint3-ci down -v --remove-orphans
